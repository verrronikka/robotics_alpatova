name: PR05 and PR06 checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pr05:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    container:
      image: ros:jazzy-ros-base-noble@sha256:8eed0a4669bbf43ee331878a4c39bd8ebddea8e3312a58b4fae8edb14526b617

    defaults:
      run:
        shell: bash

    env:
      ROS_DOMAIN_ID: "16"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w11-0b67bfd41448.tar.gz
      COURSE_KIT_SHA256: 0b67bfd41448549d21122124b7f49211ba2cd068cc56751871f319eadeb9d0ab

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            python3-colcon-common-extensions \
            python3-setuptools \
            python3-pytest \
            liburdfdom-tools \
            ros-jazzy-xacro \
            ros-jazzy-robot-state-publisher \
            ros-jazzy-rviz2 \
            ros-jazzy-ament-cmake-pytest \
            ros-jazzy-turtlesim \
            ros-jazzy-launch-ros \
            ros-jazzy-ros2bag \
            ros-jazzy-rosbag2-transport \
            ros-jazzy-rosbag2-storage-mcap \
            ros-jazzy-ament-copyright \
            ros-jazzy-ament-flake8 \
            ros-jazzy-ament-pep257

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build packages and check installed launch
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          test -f "$(ros2 pkg prefix course_bringup)/share/course_bringup/launch/patrol.launch.py"
          ros2 launch course_bringup patrol.launch.py --show-args
          ros2 pkg executables patrol | grep -Fx 'patrol patrol'
          ros2 pkg executables patrol | grep -Fx 'patrol pose_relay'
          ros2 pkg executables patrol | grep -Fx 'patrol pose_subscriber'

      - name: Check installed robot description
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          description_share="$(ros2 pkg prefix course_description)/share/course_description"
          test -f "$description_share/launch/description.launch.py"
          test -f "$description_share/rviz/model.rviz"
          xacro "$description_share/urdf/vehicle.urdf.xacro" > /tmp/pr06-vehicle.urdf
          check_urdf /tmp/pr06-vehicle.urdf
          ros2 launch course_description description.launch.py --show-args

      - name: Run package tests
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --python-testing pytest \
            --event-handlers console_direct+ \
            --return-code-on-test-failure
          colcon test-result --verbose

      - name: Inspect submitted MCAP
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 bag info evidence/pr05/bag
          cmp evidence/pr05/bag/metadata.yaml evidence/pr05/bag-metadata.yaml

      - name: Download verified course kit
        run: |
          mkdir -p .course-kit
          curl -fsSL "$COURSE_KIT_URL" -o .course-kit/course-kit.tar.gz
          printf '%s  %s\n' \
            "$COURSE_KIT_SHA256" .course-kit/course-kit.tar.gz \
            | sha256sum -c -
          tar -xzf .course-kit/course-kit.tar.gz -C .course-kit
          test "$(cat .course-kit/v1/VERSION)" = "v1-w11"

      - name: Check PR05 submission
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR05 --submission .

      - name: Check PR06 submission
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR06 --submission .
