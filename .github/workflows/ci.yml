name: PR02 checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  pr02:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    container:
      image: ros:jazzy-ros-base-noble@sha256:8eed0a4669bbf43ee331878a4c39bd8ebddea8e3312a58b4fae8edb14526b617

    defaults:
      run:
        shell: bash

    env:
      ROS_DOMAIN_ID: "16"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      COURSE_KIT_URL: https://ros.lms.ci.nsu.ru/downloads/robotics-course-kit-v1-w09-8579e0afe96d.tar.gz
      COURSE_KIT_SHA256: 8579e0afe96d76220735b6019cc38b1f3cac8c21e4aae8470785138a74a6c54a

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            python3-colcon-common-extensions \
            python3-setuptools \
            ros-jazzy-turtlesim \
            ros-jazzy-launch-ros

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and check installed launch
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --packages-select turtle_bringup
          source install/setup.bash
          test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
          python3 -m py_compile src/turtle_bringup/launch/sim.launch.py

      - name: Download verified course kit
        run: |
          mkdir -p .course-kit
          curl -fsSL "$COURSE_KIT_URL" -o .course-kit/course-kit.tar.gz
          printf '%s  %s\n' \
            "$COURSE_KIT_SHA256" .course-kit/course-kit.tar.gz \
            | sha256sum -c -
          tar -xzf .course-kit/course-kit.tar.gz -C .course-kit

      - name: Check PR02 submission
        run: |
          python3 .course-kit/v1/tools/check_practice.py PR02 --submission .
